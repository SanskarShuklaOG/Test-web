<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Bakestoo Admin</title>
<style>
:root{--dark:#211d1b;--cream:#fbf7f1;--gold:#b98a20;--gold2:#d8b35c;--pink:#f4e2e7;--rose:#9d6674;--muted:#746d68;--line:#eadfd6;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--dark);line-height:1.5}
h2,h3{font-family:Georgia,serif;font-weight:500}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.wrap{width:min(1100px,94%);margin:auto}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{background:#fff;border:1px solid var(--line);padding:34px;width:min(380px,100%);text-align:center;animation:pin .6s var(--ease)}
.lg img{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);margin-bottom:12px}
.lg input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;margin:16px 0 12px}
.b{display:inline-block;border:1px solid var(--dark);background:transparent;border-radius:999px;padding:9px 18px;font-weight:800;text-decoration:none;font-size:14px;transition:.25s}
.b:hover{transform:translateY(-2px)}
.b.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#fff}
.b.dark{background:var(--dark);color:#fff}
header{position:sticky;top:0;background:rgba(251,247,241,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow:auto}
.tabs button{border:none;background:none;padding:9px 15px;border-radius:999px;font-weight:800;color:var(--muted);transition:.25s}
.tabs button.on{background:var(--dark);color:#fff}
main{padding:26px 0 80px}
#v{animation:pin .5s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.k,.pn{background:#fff;border:1px solid var(--line);padding:22px}
.k small{color:var(--muted);font-weight:700}.k b{display:block;font:500 34px Georgia,serif}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;margin-top:16px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{width:100%;height:var(--h);min-height:2px;background:linear-gradient(var(--gold2),var(--gold));border-radius:4px 4px 0 0;animation:grow .9s var(--d) var(--ease) both}
.bars small{font-size:10px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px}
.chips .on{background:var(--dark);color:#fff}
.oc{background:#fff;border:1px solid var(--line);margin-bottom:10px}
.oc.new{border-left:4px solid var(--gold)}
.oc summary{padding:15px 18px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.oc summary span{margin-left:auto;font-weight:800;color:var(--gold)}
.oc em{font-size:11px;font-style:normal;background:var(--pink);padding:3px 10px;border-radius:99px;font-weight:800}
.od{padding:2px 18px 18px;font-size:14px;display:grid;gap:8px;animation:pin .4s}
.od select,.ec input,.ec select{padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fffdf9}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ec{background:#fff;border:1px solid var(--line);padding:12px;display:grid;gap:8px;animation:pin .5s var(--ease) both}
.im{aspect-ratio:1;border-radius:6px;background:var(--pink) center/cover;display:grid;place-items:center;cursor:pointer;color:var(--rose);font-weight:800}
.im span{background:rgba(255,255,255,.88);padding:6px 12px;border-radius:99px;font-size:12px}
.x{border:none;background:none;color:#c0392b;font-weight:800;font-size:13px;justify-self:start}
.mut{color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:.3s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{height:0}}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="lg"><img src="bakestoo-logo.jpg" alt=""><h2>Bakestoo Admin</h2>
<input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
<button class="b dark" style="width:100%" onclick="login()">Sign in</button></div></div>
<div id="app" hidden><header><div class="wrap top"><h3>Bakestoo Admin</h3><nav class="tabs" id="tabs"></nav><a class="b" href="/" target="_blank">View site ↗</a></div></header>
<main class="wrap"><div id="v"></div></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rs=n=>'₹'+Math.round(n).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={},pw=sessionStorage.getItem('bk_pw')||'',tab='dash',FS='All',tt;
const ST=['New','Accepted','Packed','Out for delivery','Delivered','Cancelled'],TABS=[['dash','Dashboard'],['orders','Orders'],['products','Products'],['gallery','Gallery']];
const FL={products:[['name','Name'],['desc','Description'],['price','Price (₹)','number'],['type','Type',['box','treat']]],gallery:[['cat','Shows under',['orders','events','reviews']],['title','Title'],['text','Text / review']]};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)};
async function api(p,o={}){const r=await fetch('/api/admin'+p,{...o,headers:{'Content-Type':'application/json','x-admin':pw}});if(r.status===401)throw'Wrong password';const j=await r.json();if(!r.ok)throw j.error;return j}
async function login(){pw=$('#pw').value||pw;try{D=await api('');sessionStorage.setItem('bk_pw',pw);$('#login').style.display='none';$('#app').hidden=false;show(tab);setInterval(poll,20000)}catch(e){toast(typeof e==='string'?e:'Cannot reach the server')}}
function tabsUI(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="show('${k}')">${l}${k==='orders'&&D.orders.some(o=>o.status==='New')?' •':''}</button>`).join('')}
function show(t){tab=t;tabsUI();({dash,orders,products:()=>edit('products'),gallery:()=>edit('gallery')})[t]()}

function dash(){const o=D.orders.filter(x=>x.status!=='Cancelled'),rev=o.reduce((a,x)=>a+x.total,0),top={},
days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d}),
by=days.map(d=>o.filter(x=>new Date(x.at).toDateString()===d.toDateString()).reduce((a,x)=>a+x.total,0)),mx=Math.max(1,...by);
o.forEach(x=>x.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
$('#v').innerHTML=`<div class="kpis">${[['Revenue',rev,1],['Orders',o.length,0],['Avg. order',o.length?rev/o.length:0,1],['New orders',D.orders.filter(x=>x.status==='New').length,0]].map(([l,n,m])=>`<div class="k"><small>${l}</small><b data-n="${n}" data-m="${m}">0</b></div>`).join('')}</div>
<div class="two"><div class="pn"><h3>Sales · last 14 days</h3><div class="bars">${by.map((v,i)=>`<div title="${rs(v)}"><i style="--h:${v/mx*100}%;--d:${i*.04}s"></i><small>${days[i].getDate()}</small></div>`).join('')}</div></div>
<div class="pn"><h3>Top sellers</h3>${tp.map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q} sold</b></div>`).join('')||'<p class="mut">No sales yet.</p>'}</div></div>
<div class="pn"><h3>Recent orders</h3>${D.orders.slice(0,5).map(x=>`<div class="row"><span>${x.id} · ${esc(x.customer.name)}</span><span>${rs(x.total)} · ${x.status}</span></div>`).join('')||'<p class="mut">Orders will appear here.</p>'}</div>`;
document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,m=+el.dataset.m,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=(m?'₹':'')+Math.round(n*(1-Math.pow(1-p,3))).toLocaleString('en-IN');if(p<1)requestAnimationFrame(f)})(t0)})}

function orders(){const l=D.orders.filter(o=>FS==='All'||o.status===FS);
$('#v').innerHTML=`<div class="chips">${['All',...ST].map(s=>`<button class="${s===FS?'on':''}" onclick="FS='${s}';orders()">${s}</button>`).join('')}</div>`+
(l.map(o=>{const c=o.customer;return `<details class="oc ${o.status==='New'?'new':''}"><summary><b>${o.id}</b> ${esc(c.name)}<em>${o.status}</em><span>${rs(o.total)}</span></summary><div class="od">
<div class="mut">${new Date(o.at).toLocaleString('en-IN')} · ${o.pay} (${o.paid})</div>
<div><a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a> · <a target="_blank" rel="noopener" href="https://wa.me/91${c.phone.replace(/\D/g,'').slice(-10)}">WhatsApp customer</a></div>
<div>${esc(c.address)}, ${esc(c.city)} – ${esc(c.pin)}</div>${c.note?`<div>📝 ${esc(c.note)}</div>`:''}
${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}<br><small class="mut">${esc(i.detail)}</small></span><b>${rs(i.price*i.qty)}</b></div>`).join('')}
<div class="row"><span>Shipping ${o.ship?rs(o.ship):'FREE'}${o.disc?' · Discount −'+rs(o.disc):''}</span><b>Total ${rs(o.total)}</b></div>
<select onchange="st('${o.id}',this)">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div></details>`}).join('')||'<p class="mut">No orders here yet.</p>')}
async function st(id,el){try{await api('/orders/'+id,{method:'PATCH',body:JSON.stringify({status:el.value})});D.orders.find(o=>o.id===id).status=el.value;el.closest('details').querySelector('em').textContent=el.value;tabsUI();toast('Status updated')}catch(e){toast('Could not update')}}

function edit(k){$('#v').innerHTML=`<div class="bar"><span class="mut">${k==='products'?'“box” = Featured box · “treat” = Build-a-box item':'Tiles shown in the website gallery'}</span><span><button class="b" onclick="add('${k}')">+ Add</button> <button class="b gold" onclick="save('${k}')">Save changes</button></span></div>
<div class="eg">${D[k].map((r,i)=>`<div class="ec" style="animation-delay:${i*.03}s"><label class="im" style="${r.img?`background-image:url('${esc(r.img)}')`:''}"><span>${r.img?'Change photo':'+ Add photo'}</span><input type="file" accept="image/*" hidden onchange="pic('${k}',${i},this)"></label>
${FL[k].map(([f,l,t])=>Array.isArray(t)?`<select onchange="D.${k}[${i}].${f}=this.value">${t.map(x=>`<option ${x===r[f]?'selected':''}>${x}</option>`).join('')}</select>`:`<input placeholder="${l}" type="${t||'text'}" value="${esc(r[f])}" oninput="D.${k}[${i}].${f}=this.value">`).join('')}
<button class="x" onclick="del('${k}',${i})">Delete</button></div>`).join('')}</div>`}
function add(k){D[k].unshift(k==='products'?{id:'p'+Date.now(),name:'New item',desc:'',price:99,type:'treat',img:''}:{id:'g'+Date.now(),cat:'orders',title:'',text:'',img:''});edit(k)}
function del(k,i){if(confirm('Delete this item?')){D[k].splice(i,1);edit(k)}}
async function save(k){try{if(k==='products')D.products.forEach(p=>p.price=Math.max(0,+p.price||0));await api('/'+k,{method:'PUT',body:JSON.stringify(D[k])});toast('Saved — live on the website')}catch(e){toast('Save failed')}}
function pic(k,i,inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=async()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=800;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,800,800);
try{D[k][i].img=(await api('/upload',{method:'POST',body:JSON.stringify({data:c.toDataURL('image/jpeg',.85)})})).url;edit(k);toast('Photo uploaded — now tap Save changes')}catch(e){toast('Upload failed')}};im.src=URL.createObjectURL(f)}
async function poll(){try{const n=await api(''),more=n.orders.length>D.orders.length;D.orders=n.orders;tabsUI();if(more)toast('🧁 New order received!');if(tab==='orders'&&more)orders();if(tab==='dash'&&more)dash()}catch(e){}}
if(pw)login();
</script></body></html>
